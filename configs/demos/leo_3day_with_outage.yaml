# Demo: LEO conjunction with 12-hour outage
# Demonstrates the core StressLAB signal: how a sensor outage
# causes covariance growth, Pc drift, and decision instability.
#
# Usage:
#   stresslab run --config configs/demos/leo_3day_with_outage.yaml --live
#   stresslab report outputs/ --formats png,json,csv

seed: 42
miss_distance_km: 0.5
dynamics_model: two_body_plus_J2

timeline:
  t_start: 0.0
  t_end: 259200.0   # 3 days
  dt: 60.0           # 1 minute

measurement:
  update_interval: 3600.0    # 1 hour tracking cadence
  noise_sigma_pos: 0.01      # 10 m 1-sigma
  outage_windows:
    - start: 77760.0          # 21.6 hours (30% of 3 days)
      end: 120960.0           # 33.6 hours (12-hour outage)

process_noise:
  sigma_radial: 1.0e-9
  sigma_tangential: 1.0e-9
  sigma_normal: 1.0e-9
  scale: 1.0

risk:
  combined_hard_body_radius: 0.02  # 20 m

threshold_v1_decision:
  pc_threshold: 1.0e-4
  time_to_tca_gate: 86400.0  # 1 day

integrity_v1_decision:
  weights: [0.4, 0.2, 0.2, 0.2]
  threshold_monitor_to_watch: 0.25
  threshold_watch_to_warning: 0.50
  threshold_warning_to_critical: 0.75
  pc_ref: 1.0e-4
  cov_norm_ref: 100.0
  growth_rate_ref: 1.0
  staleness_ref: 86400.0
